<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜サックス奏者 青木知生（ともお）</title>
<meta name="description" content="演奏のご依頼、レッスン、ご質問はこちらから。2日以内にお返事します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">TOMOO SAX<small>サックス奏者 青木知生</small></a>
    <button class="nav-toggle" aria-label="メニュー" onclick="document.querySelector('.nav').classList.toggle('open')">MENU</button>
    <nav class="nav">
      <a href="play.html">演奏依頼</a>
      <a href="profile.html">プロフィール</a>
      <a href="https://peraichi.com/landing_pages/view/dokodemo-s-sax/">レッスン</a>
      <a href="https://www.youtube.com/@tomoosax">YouTube</a>
      <a class="btn" href="contact.html">お問い合わせ</a>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <h2>お問い合わせ</h2>
    <p class="sub">演奏のご依頼、レッスン、そのほかのご質問もこちらからどうぞ。2日以内にメールでお返事します。決まっていない項目は空欄で大丈夫です。</p>
    <form class="contact" action="https://formsubmit.co/tomoosax@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【HP】お問い合わせがありました">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" id="next-url" value="">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <div class="row2">
        <label>お名前<input name="name" required></label>
        <label>ふりがな<input name="kana"></label>
      </div>
      <label>会社名・学校名 <span class="opt">任意</span><input name="org"></label>
      <div class="row2">
        <label>メールアドレス<input type="email" name="email" required></label>
        <label>電話番号 <span class="opt">任意</span><input type="tel" name="tel"></label>
      </div>
      <label>ご用件
        <select name="type" required>
          <option value="">選んでください</option>
          <option>演奏依頼：企業のイベント</option>
          <option>演奏依頼：学校</option>
          <option>演奏依頼：結婚式・パーティー</option>
          <option>演奏依頼：施設・レストラン</option>
          <option>演奏依頼：その他</option>
          <option>レッスン</option>
          <option>その他</option>
        </select>
      </label>
      <div class="row2">
        <label>日付 <span class="opt">未定でも可</span><input name="date" placeholder="例：2027年3月中旬"></label>
        <label>会場 <span class="opt">市区町村まで</span><input name="place" placeholder="例：千葉県柏市"></label>
      </div>
      <div class="row2">
        <label>人数の目安 <span class="opt">任意</span><input name="people" placeholder="例：80名"></label>
        <label>ご予算 <span class="opt">任意</span><input name="budget" placeholder="例：5万円前後"></label>
      </div>
      <label>ご希望や詳細<textarea name="message" placeholder="イベントの内容、演奏してほしい場面、リクエスト曲など"></textarea></label>
      <div><button class="btn" type="submit">送信する</button></div>
    </form>
    <script>document.getElementById('next-url').value = new URL('thanks.html', location.href).href;</script>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div>
      <a href="play.html">演奏依頼</a><a href="profile.html">プロフィール</a><a href="contact.html">お問い合わせ</a>
    </div>
    <div>
      <a href="https://www.youtube.com/@tomoosax">YouTube</a><a href="https://www.instagram.com/tomoosax">Instagram</a><a href="https://twitter.com/tomooaokisax">X</a><a href="https://www.facebook.com/tomoo.april">Facebook</a>
    </div>
    <div>© TOMOO Sax&amp;Music 青木知生</div>
  </div>
</footer>

</body>
</html>
